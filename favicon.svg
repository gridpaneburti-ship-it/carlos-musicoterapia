<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="mandalaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2e9"/>
      <stop offset="45%" stop-color="#eed8f8"/>
      <stop offset="100%" stop-color="#daf0df"/>
    </linearGradient>
    <radialGradient id="sunGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7e1a0"/>
      <stop offset="70%" stop-color="#d4a359"/>
      <stop offset="100%" stop-color="#b57d34"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#804b62" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Círculo base armonizante -->
  <circle cx="32" cy="32" r="30" fill="url(#mandalaBg)" stroke="#ffffff" stroke-width="2.5" filter="url(#softGlow)"/>

  <!-- Ondas sonoras sagradas circulares -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#d4a359" stroke-width="1.2" stroke-dasharray="3 2.5" opacity="0.6"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#a45a66" stroke-width="1" stroke-dasharray="2 2" opacity="0.45"/>

  <!-- Pétalos de loto / rayos de luz espiritual -->
  <g fill="none" stroke="#9e5668" stroke-width="1.8" stroke-linecap="round">
    <path d="M32 10 C30 18 25 21 21 25 C25 25 28 30 32 32 C36 30 39 25 43 25 C39 21 34 18 32 10 Z" fill="#fae8f0" opacity="0.75"/>
    <path d="M21 25 C17 32 18 37 32 46 C46 37 47 32 43 25" fill="#fdfaf3" opacity="0.5"/>
    <!-- Pétalo central / Llama del ser -->
    <path d="M32 18 C28 26 28 34 32 40 C36 34 36 26 32 18 Z" fill="url(#sunGold)"/>
  </g>

  <!-- Núcleo de consciencia dorada -->
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" stroke="#a45a66" stroke-width="1.2"/>
</svg>
